name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: ./android/gradlew -p android assembleDebug

      - name: Build Release APK
        run: ./android/gradlew -p android assembleRelease

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Rename APKs
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Scanner-${{ steps.version.outputs.VERSION }}-debug.apk
          mv android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/apk/release/Scanner-${{ steps.version.outputs.VERSION }}-release.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/Scanner-${{ steps.version.outputs.VERSION }}-debug.apk
            android/app/build/outputs/apk/release/Scanner-${{ steps.version.outputs.VERSION }}-release.apk
          body: |
            ## ${{ steps.version.outputs.VERSION }}
            
            ### APK Files
            - `Scanner-${{ steps.version.outputs.VERSION }}-debug.apk` - Debug version
            - `Scanner-${{ steps.version.outputs.VERSION }}-release.apk` - Release version (unsigned)
            
            ### Changes
            See [CHANGELOG](../CHANGELOG.md) for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
